services:
  # One-shot migration runner — runs before backend starts
  migrate:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    command: ["sh", "scripts/migrate.sh"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: production
    networks:
      - coolify
    restart: "no"

  # Backend API -- not exposed to host; Traefik proxies to frontend which proxies to it internally
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      CSRF_SECRET: ${CSRF_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      NODE_ENV: production
    networks:
      - coolify
    restart: unless-stopped

  # Frontend -- nginx serves built Vite output and proxies /api + /ws to backend.
  # Traefik labels explicitly set the upstream port (3000) so Coolify's auto-inject
  # cannot override it with the default port 80.
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - coolify
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # Hostname is injected from the Coolify environment (FRONTEND_HOST) so the
      # private instance's domain stays out of this public repo. Deploy fails
      # loudly if it is unset rather than silently mis-routing.
      - "traefik.http.routers.finplan-frontend.rule=Host(`${FRONTEND_HOST:?set FRONTEND_HOST in the Coolify environment}`)"
      - "traefik.http.routers.finplan-frontend.entrypoints=http"
      - "traefik.http.services.finplan-frontend.loadbalancer.server.port=3000"

networks:
  coolify:
    external: true
